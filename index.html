<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="sidebar">
  <div class="side-art" aria-hidden="true"></div>
  <nav>
    <button class="nav active" data-page="calendar"><span class="nav-icon">▦</span><span>Calendar</span></button>
    <button class="nav" data-page="wishlist"><span class="nav-icon">◇</span><span>WISH</span></button>
  </nav>
</aside>

<div id="appShell">
  <div class="account-bar"><span id="accountEmail"></span><span id="syncStatus">연결 중</span><button id="logoutBtn">로그아웃</button></div>
  <main>
    <section id="calendar" class="page active">
      <header class="head">
        <div><p class="eyebrow">PLANNER</p><h1>Calendar</h1></div>
        <button class="primary" id="openEvent">＋ 일정 추가</button>
      </header>
      <div class="calendar-layout">
        <div class="calendar-card">
          <div class="month-bar"><button id="prev" aria-label="이전 달">‹</button><h2 id="monthTitle"></h2><button id="next" aria-label="다음 달">›</button></div>
          <div class="weekdays"><span>sun</span><span>mon</span><span>tue</span><span>wed</span><span>thu</span><span>fri</span><span>sat</span></div>
          <div class="calendar-grid" id="grid"></div>
        </div>
        <div class="day-card">
          <div class="selected-top"><h2 id="selectedDate"></h2><button class="mini-add" id="openEvent2">＋</button></div>
          <div id="events"></div>
        </div>
      </div>
    </section>

    <section id="wishlist" class="page">
      <header class="head">
        <div><p class="eyebrow">COLLECTION</p><h1>WISH</h1></div>
        <button class="primary" id="openWish">＋ 위시 추가</button>
      </header>
      <div class="wish-tabs"><button class="tab active" data-status="wish">WISH</button><button class="tab" data-status="bought">BOUGHT</button><input id="search" placeholder="검색"></div>
      <div id="wishGrid" class="wish-grid"></div>
    </section>
  </main>
</div>

<div id="authOverlay" class="auth-overlay">
  <div class="auth-card">
    <div class="auth-line" aria-hidden="true"></div>
    <h2>Welcome</h2>
    <p class="auth-sub">로그인</p>
    <form id="loginForm"><input id="authEmail" type="email" required placeholder="이메일"><input id="authPassword" type="password" minlength="6" required placeholder="비밀번호"><button class="primary">로그인</button></form>
    <button id="signupBtn" class="soft">회원가입</button><p id="authMessage" class="auth-message"></p>
  </div>
</div>

<dialog id="eventDialog"><form id="eventForm" class="modal">
  <button type="button" class="close" data-close="eventDialog">×</button>
  <p class="modal-label">EVENT</p><h2>일정 추가</h2>
  <label>날짜<input id="eventDate" type="date" required></label>
  <label>종료일 <span class="optional">(기간 일정은 날짜를 다르게 선택)</span><input id="eventEndDate" type="date" required></label>
  <label>시간 <span class="optional">(선택)</span><input id="eventTime" type="time"></label>
  <label>제목<input id="eventTitle" type="text" required placeholder="수학 학원"></label>
  <button class="primary">저장</button>
</form></dialog>

<dialog id="wishDialog"><form id="wishForm" class="modal">
  <button type="button" class="close" data-close="wishDialog">×</button>
  <p class="modal-label">WISH</p><h2>위시 추가</h2>
  <input id="wishUrl" type="url" placeholder="상품 링크 (선택)">
  <div class="wish-fetch-row">
    <button type="button" class="soft" id="previewBtn">상품 정보 가져오기</button>
    <span id="wishFetchMessage" class="fetch-message"></span>
  </div>
  <div id="preview" class="preview hidden"><img id="previewImg"><div><b id="previewTitle"></b><p id="previewPrice"></p></div></div>
  <div class="manual-fields">
    <p class="manual-label">직접 입력</p>
    <input id="wishTitle" type="text" placeholder="상품명">
    <input id="wishPrice" type="text" placeholder="가격 (예: $59.99 / 30000원)">
    <input id="wishImage" type="url" placeholder="이미지 링크 (선택)">
    <label class="file-label" for="wishImageFile">또는 사진 직접 선택 <span>JPG · PNG · WEBP</span></label>
    <input id="wishImageFile" class="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
    <div id="wishImageFileName" class="file-name"></div>
  </div>
  <select id="wishStatus"><option value="wish">WISH</option><option value="bought">BOUGHT</option></select>
  <button class="primary">저장</button>
</form></dialog>
<script type="module" src="script.js"></script>
</body></html>
