<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Gowun+Dodum&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="sidebar">
  <div class="mark" aria-hidden="true">◌</div>
  <nav>
    <button class="nav active" data-page="calendar"><span class="nav-icon">□</span><span>Calendar</span></button>
    <button class="nav" data-page="wishlist"><span class="nav-icon">☆</span><span>WISH</span></button>
  </nav>
</aside>

<div id="appShell">
  <div class="account-bar"><span id="accountEmail"></span><span id="syncStatus">연결 중</span><button id="logoutBtn">로그아웃</button></div>
  <main>
    <section id="calendar" class="page active">
      <header class="head">
        <div><h1>Calendar</h1></div>
        <button class="primary" id="openEvent">＋ 일정 추가</button>
      </header>
      <div class="calendar-layout">
        <div class="calendar-card">
          <div class="month-bar"><button id="prev" aria-label="이전 달">‹</button><h2 id="monthTitle"></h2><button id="next" aria-label="다음 달">›</button></div>
          <div class="weekdays"><span>sun</span><span>mon</span><span>tue</span><span>wed</span><span>thu</span><span>fri</span><span>sat</span></div>
          <div class="calendar-grid" id="grid"></div>
        </div>
        <div class="day-card">
          <p class="selected-label">SELECTED</p>
          <h2 id="selectedDate"></h2>
          <div id="events"></div>
          <button class="soft" id="openEvent2">＋ 일정 추가</button>
        </div>
      </div>
    </section>

    <section id="wishlist" class="page">
      <header class="head">
        <div><h1>WISH</h1></div>
        <button class="primary" id="openWish">＋ 위시 추가</button>
      </header>
      <div class="wish-tabs"><button class="tab active" data-status="wish">WISH</button><button class="tab" data-status="bought">BOUGHT</button><input id="search" placeholder="검색"></div>
      <div id="wishGrid" class="wish-grid"></div>
    </section>
  </main>
</div>

<div id="authOverlay" class="auth-overlay">
  <div class="auth-card">
    <div class="auth-mark">◌</div>
    <h2>나의 플래너</h2>
    <p class="auth-sub">로그인하고 나만의 일정을 관리해보세요.</p>
    <form id="loginForm"><input id="authEmail" type="email" required placeholder="이메일"><input id="authPassword" type="password" minlength="6" required placeholder="비밀번호"><button class="primary">로그인</button></form>
    <button id="signupBtn" class="soft">처음이라면 회원가입</button><p id="authMessage" class="auth-message"></p>
  </div>
</div>

<dialog id="eventDialog"><form id="eventForm" class="modal">
  <button type="button" class="close" data-close="eventDialog">×</button>
  <p class="modal-label">NEW EVENT</p><h2>일정 추가</h2>
  <p class="hint">한 줄로 입력하면 날짜와 시간을 읽어 캘린더에 넣어줘요.<br>기간도 입력할 수 있어요. 예) 9월 10일부터 9월 13일까지 오후 3시 시험기간</p>
  <input id="quickEvent" required placeholder="날짜 + 시간 + 일정">
  <button class="primary">캘린더에 넣기</button>
</form></dialog>

<dialog id="wishDialog"><form id="wishForm" class="modal">
  <button type="button" class="close" data-close="wishDialog">×</button>
  <p class="modal-label">NEW WISH</p><h2>위시 추가</h2>
  <p class="hint">상품 링크를 넣으면 가능한 경우 상품명·사진·가격을 자동으로 가져와요.</p>
  <input id="wishUrl" type="url" required placeholder="https://...">
  <div id="preview" class="preview hidden"><img id="previewImg"><div><b id="previewTitle"></b><p id="previewPrice"></p></div></div>
  <select id="wishStatus"><option value="wish">WISH</option><option value="bought">BOUGHT</option></select>
  <button type="button" class="soft" id="previewBtn">상품 정보 가져오기</button>
  <button class="primary">저장하기</button>
</form></dialog>
<script type="module" src="script.js"></script>
</body></html>
